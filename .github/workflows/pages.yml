name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the build and download LFS content
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - name: Verify LFS objects
        run: git lfs fsck
      - name: Assemble only the game files
        run: python3 scripts/prepare_pages.py --source . --output "$RUNNER_TEMP/pages-site"
      - name: Upload the materialized site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site artifact
        id: deployment
        uses: actions/deploy-pages@v4
